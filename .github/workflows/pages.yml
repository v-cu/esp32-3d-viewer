# Builds the firmware and publishes the web installer + model studio on GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Firmware and web installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags for the version shown on the page

      - name: Build the firmware (ESP-IDF v5.5.1)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware

      - name: Assemble the site
        run: |
          sudo chown -R "$(id -u):$(id -g)" firmware/build
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/build_site.py --build firmware/build --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
